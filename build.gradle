allprojects {
    if (project.name == 'broker') {
        return
    }

    apply plugin: 'java'
    apply plugin: 'idea'

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:26.1.0'
    }

    compileJava {
        options.encoding = 'UTF-8'
    }

    java {
        toolchain.languageVersion.set(JavaLanguageVersion.of(8))
        withSourcesJar()
        withJavadocJar()
    }

    javadoc {
        options {
            links 'https://docs.oracle.com/en/java/javase/11/docs/api/'
            links 'https://javadoc.io/doc/org.jetbrains/annotations/latest/'
        }
    }
}

subprojects {
    if (project.name == 'broker') {
        return
    }

    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    apply from: "$rootDir/gradle/publish-config.gradle"

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
            }
        }
    }

    if (project.name.startsWith('broker-')) {
        dependencies {
            api project(':api')
        }

        publishing {
            publications {
                maven(MavenPublication) {
                    artifactId = 'delivery4j-' + project.name

                    pom {
                        afterEvaluate {
                            description = "Module \"${project.name}\" of Delivery4j"
                        }
                    }
                }
            }
        }
    }
}

javadoc {
    options {
        links 'https://logging.apache.org/log4j/2.x/javadoc/log4j-api/'
        links 'https://slf4j.org/api/'
    }
}

def javadocProjects= [
        ':api',
        ':broker:broker-activemq',
        ':broker:broker-kafka',
        ':broker:broker-nats',
        ':broker:broker-postgresql',
        ':broker:broker-postgresql-hikari',
        ':broker:broker-rabbitmq',
        ':broker:broker-redis-jedis',
        ':broker:broker-redis-lettuce',
        ':broker:broker-sql',
        ':broker:broker-sql-hikari',
        ':broker:broker-valkey'
]

tasks.register('allJavadoc', Javadoc) {
    group = 'documentation'

    source javadocProjects.collect { project(it).sourceSets.main.allJava }
    classpath = files(javadocProjects.collect { project(it).sourceSets.main.compileClasspath })
    javadocTool.set(javaToolchains.javadocToolFor {
        languageVersion.set(JavaLanguageVersion.of(25))
    })

    options {
        def allLinks = javadocProjects.collect { projectPath ->
            project(projectPath).javadoc.options.links
        }.flatten().unique()
        allLinks.each { link -> links link }
    }

    destinationDir = file(project.layout.buildDirectory.dir('docs/all-javadoc'))
}
