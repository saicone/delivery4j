description = 'Delivery4j Broker SQL Hikari'

dependencies {
    api project(':broker:broker-sql')
    api libs.hikaricp
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(11))
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

javadoc {
    options {
        links "https://javadoc.io/doc/com.zaxxer/HikariCP/${libs.versions.hikaricp.get()}/"
    }
}