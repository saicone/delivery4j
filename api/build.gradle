description = 'Delivery4j'

dependencies {
    compileOnly(libs.log4j.api) { transitive = false }
    compileOnly(libs.slf4j.api) { transitive = false }

    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)

    testImplementation libs.annotations
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                afterEvaluate {
                    description = 'Java library facade for multiple data delivery concepts'
                }
            }
        }
    }
}