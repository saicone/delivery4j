metadata.format.version = "1.1"

[versions]

activemq = "6.2.3"
annotations = "26.1.0"
hikaricp = "7.0.2"
jedis = "7.4.1"
junit = "5.14.3"
kafka = "4.2.0"
lettuce = "7.5.1.RELEASE"
log4j = "2.25.4"
nats = "2.25.2"
postgresql = "42.7.10"
rabbitmq = "5.29.0"
slf4j = "2.0.17"
valkey = "5.5.0"

[libraries]

annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
activemq-client = { module = "org.apache.activemq:activemq-client", version.ref = "activemq" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
nats = { module = "io.nats:jnats", version.ref = "nats" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
rabbitmq = { module = "com.rabbitmq:amqp-client", version.ref = "rabbitmq" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
valkey = { module = "io.valkey:valkey-java", version.ref = "valkey" }

